<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Venvidrio — Control de Calidad</title>

  <!-- CSS (CORREGIDO para subir un nivel) -->
  <link rel="stylesheet" href="../assets/css/login_styless.css" />

  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet" />
</head>

<body>

  <div class="login-root">

    <div class="bg-orb orb1"></div>
    <div class="bg-orb orb2"></div>
    <div class="bg-orb orb3"></div>
    <div class="glass-lines"></div>

    <div class="card" id="loginCard">

      <!-- ================= BOTÓN VOLVER AL INICIO ================= -->
      <a href="index.html" class="back-btn" title="Volver a la página de inicio">
        <i class="ti ti-arrow-left"></i> Volver
      </a>

      <!-- ================= OVERLAY DE ÉXITO ================= -->
      <div class="success-overlay" id="successOverlay">
        <div class="check-circle">
          <i class="ti ti-check"></i>
        </div>
        <p class="success-text">Acceso concedido</p>
        <p class="success-sub">Cargando sistema...</p>
      </div>

      <!-- ================= MENSAJE DE ERROR FLOTANTE ================= -->
      <div class="error-message" id="errorMessage">
        <i class="ti ti-alert-circle"></i>
        <span id="errorText">Credenciales incorrectas</span>
      </div>

      <!-- ================= LOGO REAL DE VENVIDRIO (CORREGIDO) ================= -->
      <div class="logo-area" id="logoArea">
        <img src="../assets/img/logo-venvidrio_index.png" alt="Venvidrio Logo" class="login-logo" />
        <div class="divider"></div>
      </div>

      <!-- ================= CAMPO USUARIO ================= -->
      <div class="field-group">
        <label class="field-label">Usuario</label>
        <div class="field-wrapper" style="display: flex; align-items: center; padding-right: 12px;">
          <i class="ti ti-user field-icon"></i>
          <input class="field-input" id="username-prefix" type="text" autocomplete="username" placeholder="usuario" style="flex: 1; border: none; background: transparent;" />
          <span style="font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--text-muted, #666); margin-left: 4px;">@venvidrio.com</span>
        </div>
      </div>

      <!-- ================= CAMPO CONTRASEÑA ================= -->
      <div class="field-group">
        <label class="field-label">Contraseña</label>
        <div class="field-wrapper">
          <i class="ti ti-lock field-icon"></i>
          <input class="field-input" id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
          <button class="pw-toggle" id="pwToggle" type="button">
            <i class="ti ti-eye" id="pwIcon"></i>
          </button>
        </div>
      </div>

      <!-- ================= ADVERTENCIA DE CAPS LOCK ================= -->
      <div class="caps-lock-warning" id="capsLockWarning">
        <i class="ti ti-alert-triangle"></i>
        <span>La tecla Bloq Mayús está activa</span>
      </div>

      <!-- ================= RECORDAR SESIÓN + OLVIDÉ CONTRASEÑA ================= -->
      <div class="options-row">
        <label class="custom-checkbox">
          <input type="checkbox" id="rememberMe" />
          <span class="checkmark"></span>
          Recordar mi sesión
        </label>

        <a href="recuperar.html" class="forgot-link" id="forgotLink">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <!-- ================= BOTÓN INICIAR SESIÓN ================= -->
      <button class="submit-btn" id="submitBtn" type="button">
        <span class="btn-content">
          <span class="loading-ring"></span>
          <i class="ti ti-login btn-icon"></i>
          <span class="btn-text">Iniciar sesión</span>
        </span>
      </button>

      <!-- ================= FOOTER ================= -->
      <div class="footer-note">
        Sistema protegido · <strong>Venvidrio S.A.</strong>
      </div>

    </div>

  </div>

  <!-- ================= JS (CORREGIDO) ================= -->
   <script src="../assets/js/shared.js"></script>
  <script src="../assets/js/login_app.js"></script>

</body>
</html>
