<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover ayuda con pantallas con notch (iPhone) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Color de la barra del navegador en Android/iOS -->
  <meta name="theme-color" content="#0f172a" />
  <title>Venvidrio — Iniciar Sesión</title>

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/login.css" />

  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet" />
</head>

<body>

  <div class="login-root">

    <div class="bg-orb orb1"></div>
    <div class="bg-orb orb2"></div>
    <div class="bg-orb orb3"></div>
    <div class="glass-lines"></div>

    <div class="card" id="loginCard">

      <!-- Botón volver al inicio -->
      <a href="index.html" class="back-btn" title="Volver a la página de inicio">
        <i class="ti ti-arrow-left"></i> Volver
      </a>

      <!-- Overlay de éxito -->
      <div class="success-overlay" id="successOverlay">
        <div class="check-circle">
          <i class="ti ti-check"></i>
        </div>
        <p class="success-text">Acceso concedido</p>
        <p class="success-sub">Cargando sistema...</p>
      </div>

      <!-- Mensaje de error flotante -->
      <div class="error-message" id="errorMessage">
        <i class="ti ti-alert-circle"></i>
        <span id="errorText">Credenciales incorrectas</span>
      </div>

      <!-- Logo -->
      <div class="logo-area" id="logoArea">
        <img src="../assets/img/logo-venvidrio_index.png" alt="Venvidrio Logo" class="login-logo" />
        <div class="divider"></div>
      </div>

      <!-- Campo Usuario -->
      <div class="field-group">
        <label class="field-label" for="username-prefix">Usuario o Correo</label>
        <div class="field-wrapper">
          <i class="ti ti-user field-icon"></i>
          <!-- Placeholder acortado para que no desborde en móviles -->
          <input 
            class="field-input" 
            id="username-prefix" 
            type="text" 
            autocomplete="username" 
            placeholder="Usuario o correo" 
          />
        </div>
      </div>

      <!-- Campo Contraseña -->
      <div class="field-group">
        <label class="field-label" for="password">Contraseña</label>
        <div class="field-wrapper">
          <i class="ti ti-lock field-icon"></i>
          <input 
            class="field-input" 
            id="password" 
            type="password" 
            autocomplete="current-password" 
            placeholder="••••••••" 
          />
          <button class="pw-toggle" id="pwToggle" type="button" aria-label="Mostrar contraseña">
            <i class="ti ti-eye" id="pwIcon"></i>
          </button>
        </div>
      </div>

      <!-- Advertencia de Caps Lock -->
      <div class="caps-lock-warning" id="capsLockWarning">
        <i class="ti ti-alert-triangle"></i>
        <span>La tecla Bloq Mayús está activa</span>
      </div>

      <!-- Opciones -->
      <div class="options-row">
        <label class="custom-checkbox" for="rememberMe">
          <input type="checkbox" id="rememberMe" />
          <span class="checkmark"></span>
          Recordar mi sesión
        </label>

        <a href="recuperar.html" class="forgot-link" id="forgotLink">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <!-- Botón Iniciar Sesión -->
      <button class="submit-btn" id="submitBtn" type="button">
        <span class="btn-content">
          <span class="loading-ring"></span>
          <i class="ti ti-login btn-icon"></i>
          <span class="btn-text">Iniciar sesión</span>
        </span>
      </button>

      <!-- Footer -->
      <div class="footer-note">
        Sistema protegido · <strong>Venvidrio S.A.</strong>
      </div>

    </div>

  </div>

  <!-- Scripts -->
  <script src="../assets/js/shared.js"></script>
  <script src="../assets/js/login_app.js"></script>

</body>
</html>
