<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  
  <!-- 👇 TÍTULO ACTUALIZADO 👇 -->
  <title>Venvidrio | Iniciar Sesión</title>

  <!-- 👇 FAVICON (.ico) 👇 -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <!-- 👇 CSP FORZADA DESDE EL HTML PARA PERMITIR CLOUDFLARE Y EL BACKEND 👇 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://cdn.jsdelivr.net; frame-src 'self' https://challenges.cloudflare.com; connect-src 'self' data: https://challenges.cloudflare.com https://calidad-venvidrio-repository-main.onrender.com; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net;">

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/login.css" />

  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet" />

  <!-- Script de Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>

<body>

  <div class="login-root">

    <div class="bg-orb orb1"></div>
    <div class="bg-orb orb2"></div>
    <div class="bg-orb orb3"></div>
    <div class="glass-lines"></div>

    <div class="card" id="loginCard">

      <!-- Botón volver al inicio -->
      <a href="index.html" class="back-btn" title="Volver a la página de inicio">
        <i class="ti ti-arrow-left"></i> Volver
      </a>

      <!-- Overlay de éxito -->
      <div class="success-overlay" id="successOverlay">
        <div class="check-circle">
          <i class="ti ti-check"></i>
        </div>
        <p class="success-text">Acceso concedido</p>
        <p class="success-sub">Cargando sistema...</p>
      </div>

      <!-- Mensaje de error flotante -->
      <div class="error-message" id="errorMessage">
        <i class="ti ti-alert-circle"></i>
        <span id="errorText">Credenciales incorrectas</span>
      </div>

      <!-- Logo -->
      <div class="logo-area" id="logoArea">
        <img src="../assets/img/logo-venvidrio_index.png" alt="Venvidrio Logo" class="login-logo" />
        <div class="divider"></div>
      </div>

      <!-- Campo Usuario -->
      <div class="field-group">
        <label class="field-label" for="username-prefix">Usuario</label>
        <div class="field-wrapper" style="position: relative; display: flex; align-items: center; width: 100%;">
          <i class="ti ti-user field-icon" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 18px; pointer-events: none; z-index: 2;"></i>
          <input 
            class="field-input" 
            id="username-prefix" 
            type="text" 
            autocomplete="username" 
            placeholder="Ej: juan.perez" 
            style="width: 100%; box-sizing: border-box; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 11px 14px 11px 42px; padding-right: 120px; font-size: 14px; font-family: 'DM Sans', sans-serif; color: #0f172a; outline: none; appearance: none; -webkit-appearance: none;" 
          />
          <span style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 14px; color: #94a3b8; pointer-events: none; z-index: 2;">@venvidrio.com</span>
        </div>
      </div>

      <!-- Campo Contraseña -->
      <div class="field-group">
        <label class="field-label" for="password">Contraseña</label>
        <div class="field-wrapper" style="position: relative; display: flex; align-items: center; width: 100%;">
          <i class="ti ti-lock field-icon" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 18px; pointer-events: none; z-index: 2;"></i>
          <input 
            class="field-input" 
            id="password" 
            type="password" 
            autocomplete="current-password" 
            placeholder="••••••••" 
            style="width: 100%; box-sizing: border-box; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 11px 14px 11px 42px; padding-right: 42px; font-size: 14px; font-family: 'DM Sans', sans-serif; color: #0f172a; outline: none; appearance: none; -webkit-appearance: none;" 
          />
          <button class="pw-toggle" id="pwToggle" type="button" aria-label="Mostrar contraseña" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #94a3b8; font-size: 18px; padding: 4px; line-height: 1; z-index: 2;">
            <i class="ti ti-eye" id="pwIcon"></i>
          </button>
        </div>
      </div>

      <!-- Advertencia de Caps Lock -->
      <div class="caps-lock-warning" id="capsLockWarning">
        <i class="ti ti-alert-triangle"></i>
        <span>La tecla Bloq Mayús está activa</span>
      </div>

      <!-- Opciones -->
      <div class="options-row">
        <label class="custom-checkbox" for="rememberMe">
          <input type="checkbox" id="rememberMe" />
          <span class="checkmark"></span>
          Recordar mi sesión
        </label>

        <a href="recuperar.html" class="forgot-link" id="forgotLink">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <!-- Contenedor del CAPTCHA de Cloudflare -->
      <div id="captcha-container" style="margin-bottom: 1rem; display: flex; justify-content: center;">
        <!-- 👇 AQUÍ VA LA NUEVA SITE KEY DE CLOUDFLARE 👇 -->
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAF5fjGofOkfN2L2x"></div>
      </div>

      <!-- Botón Iniciar Sesión -->
      <button class="submit-btn" id="submitBtn" type="button">
        <span class="btn-content">
          <span class="loading-ring"></span>
          <i class="ti ti-login btn-icon"></i>
          <span class="btn-text">Iniciar sesión</span>
        </span>
      </button>

      <!-- Footer -->
      <div class="footer-note">
        Sistema protegido · <strong>Venvidrio S.A.</strong>
      </div>

    </div>

  </div>

  <!-- Scripts -->
  <script src="../assets/js/shared.js"></script>
  <script src="../assets/js/login_app.js"></script>

</body>
</html>
